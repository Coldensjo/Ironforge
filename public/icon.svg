<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
	<defs>
		<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a0"/>
			<stop offset="0.45" stop-color="#e0a93a"/>
			<stop offset="1" stop-color="#8a5a14"/>
		</linearGradient>
		<radialGradient id="back" cx="50%" cy="38%" r="70%">
			<stop offset="0" stop-color="#6b737c"/>
			<stop offset="0.6" stop-color="#3b4249"/>
			<stop offset="1" stop-color="#1d2126"/>
		</radialGradient>
		<radialGradient id="skin" cx="45%" cy="35%" r="70%">
			<stop offset="0" stop-color="#f6c9a2"/>
			<stop offset="0.6" stop-color="#df9d74"/>
			<stop offset="1" stop-color="#a8664a"/>
		</radialGradient>
		<radialGradient id="nose" cx="40%" cy="35%" r="70%">
			<stop offset="0" stop-color="#f7c6a0"/>
			<stop offset="0.6" stop-color="#e09068"/>
			<stop offset="1" stop-color="#b0604a"/>
		</radialGradient>
		<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffb24a"/>
			<stop offset="0.5" stop-color="#ec6a1c"/>
			<stop offset="1" stop-color="#a8360c"/>
		</linearGradient>
		<linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f58a2a"/>
			<stop offset="0.5" stop-color="#e05a16"/>
			<stop offset="1" stop-color="#9a2e0a"/>
		</linearGradient>
		<radialGradient id="leather" cx="40%" cy="30%" r="75%">
			<stop offset="0" stop-color="#e2a24a"/>
			<stop offset="0.55" stop-color="#b06a24"/>
			<stop offset="1" stop-color="#6a3a12"/>
		</radialGradient>
		<linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#8a8f96"/>
			<stop offset="1" stop-color="#3a3e44"/>
		</linearGradient>
		<clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
	</defs>

	<!-- Gold rim -->
	<circle cx="128" cy="128" r="122" fill="url(#gold)"/>
	<circle cx="128" cy="128" r="122" fill="none" stroke="#4a2e08" stroke-width="4"/>
	<circle cx="128" cy="128" r="106" fill="#4a2e08"/>
	<circle cx="128" cy="128" r="104" fill="url(#back)"/>

	<g clip-path="url(#disc)" stroke-linejoin="round" stroke-linecap="round">
		<g transform="translate(128 140) scale(1.12) translate(-128 -136)">
		<!-- Hair, swept back and up -->
		<path d="M78 112c-10-26-4-54 16-68-2 8 0 14 4 16 4-14 16-24 30-26-4 6-4 12-2 16 8-10 22-14 34-12-6 4-8 10-8 14 14-2 28 8 32 20-6-2-12-2-16 2 10 8 12 22 8 38z" fill="url(#hair)" stroke="#5a1c06" stroke-width="3.5"/>

		<!-- Ears -->
		<path d="M84 104c-12-4-16 10-12 20 4 8 10 10 16 8z" fill="url(#skin)" stroke="#6a3a26" stroke-width="3"/>
		<path d="M172 104c12-4 16 10 12 20-4 8-10 10-16 8z" fill="url(#skin)" stroke="#6a3a26" stroke-width="3"/>

		<!-- Face: a broad, weathered head -->
		<path d="M86 108c0-30 18-50 42-50s42 20 42 50l2 22c0 14-16 24-44 24s-44-10-44-24z" fill="url(#skin)" stroke="#6a3a26" stroke-width="3"/>
		<path d="M104 72c8-6 16-8 26-8" fill="none" stroke="#ffe3c8" stroke-opacity="0.6" stroke-width="4"/>
		<!-- Ruddy cheeks -->
		<ellipse cx="100" cy="128" rx="10" ry="7" fill="#d4624a" opacity="0.45"/>
		<ellipse cx="156" cy="128" rx="10" ry="7" fill="#d4624a" opacity="0.45"/>

		<!-- Stern eyes, blue -->
		<path d="M101 113c5-3 11-3 16 0-5 4-11 4-16 0z" fill="#fff6ea"/>
		<path d="M139 113c5-3 11-3 16 0-5 4-11 4-16 0z" fill="#fff6ea"/>
		<circle cx="110" cy="113" r="3" fill="#3d8fd6"/>
		<circle cx="146" cy="113" r="3" fill="#3d8fd6"/>
		<circle cx="110" cy="113" r="1.4" fill="#10202e"/>
		<circle cx="146" cy="113" r="1.4" fill="#10202e"/>
		<path d="M100 112c6-4 12-4 18 1M138 113c6-5 12-5 18-1" fill="none" stroke="#5a2a18" stroke-width="2.5"/>
		<!-- Heavy brows, drawn down in a frown -->
		<path d="M84 94c8-4 16-6 24-4 8 2 14 8 20 16-6-1-12-2-18 0-6 2-12 2-18 0-4-2-7-6-8-12z" fill="url(#hair)" stroke="#5a1c06" stroke-width="3"/>
		<path d="M172 94c-8-4-16-6-24-4-8 2-14 8-20 16 6-1 12-2 18 0 6 2 12 2 18 0 4-2 7-6 8-12z" fill="url(#hair)" stroke="#5a1c06" stroke-width="3"/>
		<path d="M124 102c2 3 6 3 8 0" fill="none" stroke="#8a4a32" stroke-width="2.5"/>

		<!-- Beard: a great flowing mass over the chest -->
		<path d="M82 120c-12 30-12 70 8 102 10 16 24 28 38 36 14-8 28-20 38-36 20-32 20-72 8-102-6 22-24 38-46 38s-40-16-46-38z" fill="url(#beard)" stroke="#5a1c06" stroke-width="3.5"/>
		<path d="M96 160c-4 22 2 46 14 66M112 166c-2 24 2 46 10 64M144 166c2 24-2 46-10 64M160 160c4 22-2 46-14 66M128 170v72" fill="none" stroke="#a83a0e" stroke-width="3.5" opacity="0.85"/>
		<path d="M104 176c-2 14 0 26 6 38M150 176c2 14 0 26-6 38" fill="none" stroke="#ffb35a" stroke-width="2.5" opacity="0.7"/>

		<!-- Moustache, sweeping out -->
		<path d="M128 140c-12-6-30-4-42 8-6 6-14 6-18 2 4 16 22 22 38 14 10-5 16-8 22-8s12 3 22 8c16 8 34 2 38-14-4 4-12 4-18-2-12-12-30-14-42-8z" fill="url(#hair)" stroke="#5a1c06" stroke-width="3.5"/>

		<!-- A big dwarven nose -->
		<path d="M120 104c-2 12-10 18-10 28 0 10 8 14 18 14s18-4 18-14c0-10-8-16-10-28z" fill="url(#nose)" stroke="#6a3a26" stroke-width="3"/>
		<ellipse cx="122" cy="126" rx="4" ry="3" fill="#fff0e0" opacity="0.6"/>
		</g>
	</g>
</svg>
